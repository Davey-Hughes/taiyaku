# cargo-mutants configuration. `scripts/mutants.sh` is the entry point. A bare
# `cargo mutants` run by hand reads this file but not what the script adds:
# `--gitignore=true`, which this tree cannot do without (see below), `--jobs`,
# `--output`, and the environment the script sets.
#
# **It must live at `.cargo/mutants.toml`**, where cargo-mutants looks. A config
# file that is not read fails exactly like a config file whose settings happen
# to be the defaults.
#
# **Nothing here makes mutation testing a gate.** A sweep of the whole workspace
# is far too slow to sit in `check-all.sh` before every push.
# `.forgejo/workflows/mutants.yml` runs it and gates nothing; the script's
# `--since` mode is what makes it usable on a branch.

# **`cargo test`, deliberately.** The reason to use nextest would be
# `.config/nextest.toml`'s per-test bound, so a mutant that stops a loop
# terminating is reported TIMEOUT rather than hanging the run (O39).
# cargo-mutants already has its own per-mutant timeout — it prints
# `Auto-set test timeout to 20s` — so the bound nextest would add is
# already present.
#
# nextest also runs **one process per test**, as many at once as there are
# cores, where `cargo test` runs the suite in one process, so it multiplies a
# bounded-per-process memory limit by the number of cores.
#
# Every sweep whose numbers this project records ran under `cargo test`, which
# is what makes it the measured configuration rather than the guess.
test_tool = "cargo"

# **Every feature, so the RAR backend is swept.** `taiyaku-read`'s
# `rar/libarchive.rs` compiles only with `rar-libarchive`, so without this a
# mutant there changes nothing that is built and every one would be missed.
# The sweep's container installs libarchive for it (`mutants.yml`).
all_features = true

# **The build directory is a copy of this tree, and this tree has a large
# gitignored corpus in it.** Without this, cargo-mutants copies `corpus/` into
# /tmp for every build directory and dies with `No space left on device` — an
# error naming neither the corpus nor the ignore file.
#
# The script passes it as `--gitignore=true`; this file does not set the
# `gitignore` key cargo-mutants also reads, and this comment is here because
# this is where somebody will look for it. See `scripts/mutants.sh`.

# **`detect.rs` and `regions.rs` are excluded.** They cost about ten minutes of
# wall clock on the forge every time `taiyaku-cli` comes up, and that buys
# nothing: every survivor in them was accepted in `docs/mutants-baseline.md` as
# deferred until L2 redesigns the detector, the code is slated for replacement
# rather than repair, and a file whose every survivor is accepted has nothing
# left to regress *into* — a new survivor there would be accepted on sight for
# the same reason the existing ones are.
#
# So the trade is ten minutes against noticing a regression in code about to be
# deleted. Delete the exclusion when L2 lands and the detector is worth testing
# again; `docs/mutants-baseline.md`'s header records that these files are
# unswept rather than clean, which is the distinction that must not be lost.

# Experiments and survey binaries: these print measurements and assert nothing,
# which is what the coverage steps' `--ignore-filename-regex` already exempts
# them from for the same reason. A mutant in a file whose output is read by a
# person is not a defect a test could have caught.
exclude_globs = [
    "**/detect.rs",
    "**/regions.rs",
    "**/band_sweep.rs",
    "**/borrow_frequency.rs",
    "**/geometry_experiment.rs",
    "**/match_experiment.rs",
    "**/match_experiment/**",
    "**/model_experiment.rs",
    "**/region_experiment.rs",
    "**/truth_population.rs",
    "**/score_corpus.rs",
    # Test code cargo-mutants would otherwise mutate: it skips a module declared
    # `#[cfg(test)]`, but not `rar_tests.rs` under `all(test, rar)`, nor a
    # `test_support.rs` that the `test-support` feature builds for other crates'
    # tests. A mutant there changes a test, not taiyaku, and one that empties an
    # assertion helper survives by construction.
    "**/test_support.rs",
    "**/rar_tests.rs",
]
