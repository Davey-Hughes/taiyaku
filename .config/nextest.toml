# Nothing else in this repository bounds a test's runtime: without this file, a
# regression that stopped a loop terminating would hang the forge until the
# runner's own limit rather than fail it. See docs/status.md, O39.
#
# Argon2 is deliberately expensive and runs unoptimized under `cargo test` —
# this workspace sets no `[profile.dev]` opt-level — so every test that verifies
# a password pays for it. The suite's own fixtures do not: `test_support` pins a
# precomputed hash and authenticates with an API key, which spec A2's §2 routes
# past argon2 by its `tyk_` prefix. What remains slow is the three tests whose
# *subject* is password guessing — `succeeding_forgets_the_failures_before_it`
# runs nineteen logins on purpose — and making those cheap would mean not
# testing the thing.
#
# So: **the slowest test is `succeeding_forgets_the_failures_before_it` at
# roughly 5 s, and it moves by a few hundred milliseconds between runs because
# argon2 is what it is timing. 30 s is about 6x it and 60 s about 12x.** That is
# stated rather than left to be discovered by a shared runner killing a job at
# `terminate-after`. The slack is for a shared docker runner, which is slower
# than the machine that measured this by a factor nobody has measured — the one
# guess here, and it says so.
#
# `report_the_argon2_cost` is `#[ignore]`d: it is a measurement tool that
# asserts nothing, and it has no business spending the budget a timeout is
# reasoning about.
[profile.default]
# A machine-readable summary of the run, at `target/nextest/default/junit.xml`,
# written as a side effect of a run that was happening anyway. It is what
# `scripts/status-test-count.mjs` reads to check the test count `docs/status.md`
# states in two places.
#
# **Reading it instead of running `cargo nextest list` saves a rebuild of the
# whole workspace.** The list is a more robust source — it reads no environment
# and cannot be perturbed by a failing suite — but `cargo llvm-cov nextest`
# builds with coverage instrumentation and a plain `nextest list` cannot reuse
# those artifacts. The robustness is recovered instead by refusing to compare
# when the report shows a failure; see that script's header.
junit = { path = "junit.xml" }
slow-timeout = { period = "30s", terminate-after = 2 }

# The exempt set matches the regex both coverage steps of ci.yml and
# check-all.sh carry —
# `--ignore-filename-regex '(band_sweep|book_experiment|borrow_frequency|geometry_experiment|match_experiment[/a-z_]*|model_experiment|region_experiment|truth_population|score_corpus|/corpus|test_support)\.rs$'`
# — which matches the files `docs/ci.md` tables under
# "The ignored Rust files, named". This is not one exempt set shared three ways:
# the two coverage steps share one regex string, but nextest's `filter` selects
# by test name rather than by file, so this file cannot reuse that string — the
# same set is expressed a second way, by module, and has to be kept in step with
# the regex by hand rather than by sharing it.
#
# The tests below are marked SLOW and left alone rather than killed. A global
# kill would destroy a deliberate measurement: `geometry_experiment` in the
# debug profile with `TAIYAKU_CORPUS` set runs 40+ minutes. Omitting
# `terminate-after` is what makes a slow-timeout advisory, not a separate key.
# Under the default `slow-timeout = { period = "30s", terminate-after = 2 }` a
# test that passes on a fast machine dies on a slower one — the default would
# kill `the_model_candidate_scored`, which runs 42.2 s on 32 cores, at 60 s —
# which is exactly the failure this override exists to prevent.
#
# `test(corpus::)` selects the standing checks against real archives, the
# `corpus::tests::` helpers that only assert how `TAIYAKU_CORPUS` is validated,
# and the `score_corpus::` tests, caught by substring — `score_corpus::`
# contains `corpus::`, so the first term already selects them and the separate
# `test(score_corpus)` term below is redundant. It is kept anyway: it costs
# nothing, and it keeps the intent legible if either module is ever renamed.
# Matching `cargo test`'s selection exactly is the point — the exempt set must
# be the set the corpus step runs, or the two silently disagree.
#
# `test(score_corpus)` is the same shape as the two experiments beside it: gated
# on `TAIYAKU_CORPUS`, skipping cleanly without it, and decoding real
# full-resolution pages when it has it, so the 30 s default would bound a
# measurement rather than a bug.
#
# `test(band_sweep)`, `test(truth_population)` and `test(model_experiment)` are
# the same shape again: `band_sweep` scores component-size bands over the
# labelled pages so `BAND` is read off a table rather than argued for;
# `truth_population` reads hand-drawn boxes over those same pages to derive
# `detect.rs`'s size band, ink floor and smear gap; `model_experiment` scores
# phase 3's model candidate against the same pages for the head-to-head table in
# `docs/notes.md`. Each is `#[cfg(test)]`, gated on `TAIYAKU_CORPUS`, and none
# of the three is a unit test with a normal budget.
#
# `test(book_experiment)` aligns whole books at each of its settings against
# hand-made keys, which no unit test's budget covers.
#
# `test(match_experiment)` fingerprints a whole library and aligns its labelled
# pairs when `TAIYAKU_MATCH_LIBRARY` is set, which no unit test's budget covers.
[[profile.default.overrides]]
filter = "test(band_sweep) + test(book_experiment) + test(corpus::) + test(geometry_experiment) + test(match_experiment) + test(model_experiment) + test(region_experiment) + test(score_corpus) + test(truth_population)"
slow-timeout = { period = "60s" }

# `a_root_that_cannot_be_written_falls_back_to_the_short_interval`
# (`taiyaku-library/src/watch/tests.rs`) skips itself with a `NOT MEASURED:`
# line on stderr when the process it is running in can still write to a 0555
# directory — which is exactly what happens under `CAP_DAC_OVERRIDE`, and
# CI's `test` job runs `rust:1-bookworm` with no `user:`, so it runs as root
# on every push. Default `success-output` prints nothing for a passing test,
# so without this override the skip is real but silent: the run shows
# `... ok` and the property this test exists to check goes unmeasured with
# nobody told. `final` prints captured output for passing tests in the
# summary at the end of the run, with no `--nocapture` needed anywhere this
# test's binary is invoked — including the coverage run `check-all.sh` and
# `ci.yml` both use, neither of which passes it.
#
# **Every test that can skip itself belongs in this filter.** Three more do:
#   - `an_unreadable_directory_is_skipped_counted_and_named_rather_than_failing_the_root`
#     (`taiyaku-library/src/scan/tests.rs`) — same root/`CAP_DAC_OVERRIDE`
#     cause, a 0000 directory this process can still list.
#   - `one_work_that_cannot_be_forgotten_does_not_stop_the_others`
#     (`taiyaku-serve/src/tests.rs`).
#   - `a_hand_written_tar_is_one_gnu_tar_can_list`
#     (`taiyaku-read/src/format/tests.rs`) — skips where `tar` is not on
#     `PATH`, which is a different cause with the same consequence: the tar
#     fixture would stop being checked against a real tar and nothing would
#     say so.
# `filter` names tests, not output, so a new self-skipping test has to be
# added here by hand. There is no expression that catches them all.
[[profile.default.overrides]]
filter = "test(a_root_that_cannot_be_written) + test(an_unreadable_directory_is_skipped) + test(one_work_that_cannot_be_forgotten) + test(a_hand_written_tar_is_one_gnu_tar_can_list)"
success-output = "final"
