name: CI

on:
  push:
    branches: [main]
  pull_request:
  # **Weekly, Sundays 10:45 UTC (03:45 PDT / 02:45 PST), so the image picks
  # up patched Debian packages in a week when nothing merges.** A dispatch on
  # `main` refreshes the same way; one on another branch runs the four
  # checks and skips `docker`. A push that lands during a refresh does not
  # cancel it, since this workflow has no `concurrency:` block; see "Build,
  # and load it" for what a refresh changes and what an overlap risks.
  schedule:
    - cron: "45 10 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Every job clones with git rather than with actions/checkout, and the reason is
# worth stating because the failure it avoids is silent. checkout is a
# JavaScript action, and a JS action needs a node inside the job's container to
# execute. rust:1-bookworm carries none — `command -v node` exits non-zero — and
# this runner does not inject one, so a job combining `container:` with any JS
# action dies before its first step. Measured against this instance: a container
# with no action passes, an action with no container passes, and both together
# is the only combination that fails.
#
# The clone is authenticated because the instance requires sign-in for all
# content, so an anonymous fetch is refused even for a public repository. The
# runner supplies FORGEJO_TOKEN for exactly this, and FORGEJO_SERVER_URL is the
# runner's own view of the forge — an address on its container network — rather
# than the public hostname.
#
# These are Forgejo's own names. The runner also exports the same values under
# GITHUB_*, for compatibility with actions written against GitHub, and both were
# measured working here. Nothing in this repository is hosted on or fetched from
# GitHub, so the names that say Forgejo are the ones used.
#
# The block is repeated per job rather than factored out. Extracting it would
# need either a composite action, which reintroduces the node problem, or a
# script from the repository, which is not on disk until after the clone.
#
# Every job but `docker` carries `timeout-minutes: 10` (that one builds an
# image, takes 60, and says why where it sets it), and it is the outer half of a bound
# that has two halves. `.config/nextest.toml` bounds a *test* — precisely, by
# name, at 60 s. This bounds a *job*, which is the only thing that can catch a
# hang outside a test: a stalled `curl` in one of the five tool-install steps
# below, or a `cargo build` that never finishes. Neither subsumes the other.
#
# 10 minutes is 4.5x the worst honest job observed over the ten runs before
# this branch (134 s). Measured from the forge's own /actions/tasks API over
# those ten runs: `test` 32-134 s, `lint` 21-85 s, `wasm` 33-84 s, `web` 9-25 s.
# Uniform across those four rather than tuned per job, because a per-job number
# has to be re-tuned as jobs shift and the only property this number needs is
# to sit between "any honest run" and "hours".
#
# **This key is untriggered rather than untested**, and deliberately so:
# deliberately hanging a job for ten minutes to watch it die costs a
# ten-minute CI run to verify one documented key, where the per-test bound
# beside it can be triggered in sixty seconds and was. See docs/status.md, O39.

jobs:
  lint:
    runs-on: docker
    timeout-minutes: 10
    container:
      image: rust:1-bookworm
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          host="${FORGEJO_SERVER_URL#http://}"; host="${host#https://}"
          scheme="${FORGEJO_SERVER_URL%%://*}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${FORGEJO_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF"
          git checkout -q FETCH_HEAD
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # `broken_intra_doc_links` only. An unresolved `[`name`]` is always a
      # defect and a rename is how it happens; `private_intra_doc_links` is
      # this workspace's own convention and must stay a warning. See the same
      # note in `scripts/check-all.sh`, which mirrors this job.
      - name: Doc links
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
      # Advisory and non-blocking, deliberately. `clippy::pedantic` is not in
      # [workspace.lints] and must not be: this container is `rust:1-bookworm`
      # and rust-toolchain.toml says `channel = "stable"`, both of which float,
      # and clippy adds lints to `pedantic` roughly every six weeks — so in the
      # blocking gate above, a rustc release would turn an unrelated PR red in a
      # file its author never touched.
      #
      # `continue-on-error: true` is what makes this step advisory rather than
      # blocking, and it is the only place in this file that uses the key. The
      # branch that added it was pushed and came back green, but that does not
      # verify the key: `-W clippy::pedantic` exits 0 regardless of how many
      # warnings it prints (only `-D warnings` sets a non-zero exit), so this
      # step succeeded on its own and `continue-on-error` was never exercised.
      # It cannot fail on a lint at all — its only possible failure is a
      # compile error, which the blocking step above would already have
      # caught — so this key and `scripts/check-all.sh`'s shell-level
      # `|| true` (which *is* verified, on every local run) are both
      # belt-and-braces for a failure lints cannot produce today. The key is
      # untriggered rather than untested; it has still never been observed
      # turning this job red.
      #
      # This step's own output is not quite empty, and that is expected rather
      # than a leak: every `assert_eq!` on a float literal in this workspace's
      # tests prints a `clippy::float_cmp` warning here, always, because
      # clippy's JSON marks that lint's primary span inside `assert_eq!`'s own
      # expansion in rustc's `core/src/macros/mod.rs` — confirmed by path in
      # the JSON stream, not assumed — never a file in this repository. That is
      # why `scripts/pedantic-sites.mjs`, the count this branch is built on,
      # reports 0 unique sites under `crates/` even though this unfiltered,
      # plain-text step still prints all of them. See docs/ci.md, "The
      # pedantic lints, and why they are advisory".
      #
      # Anything *else* that appears here is either a cast written without a
      # stated bound or a lint a new rustc added — and the per-site #[expect]
      # attributes are still enforced by the blocking step above, because a
      # stale one is `unfulfilled_lint_expectations`, an ordinary rustc lint
      # that `-D warnings` already denies.
      - name: Clippy (pedantic, advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features -- -W clippy::pedantic

  test:
    runs-on: docker
    timeout-minutes: 10
    container:
      image: rust:1-bookworm
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          host="${FORGEJO_SERVER_URL#http://}"; host="${host#https://}"
          scheme="${FORGEJO_SERVER_URL%%://*}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${FORGEJO_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF"
          git checkout -q FETCH_HEAD
      - name: Add llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        # A prebuilt release binary rather than `cargo install`, the precedent
        # the `wasm` job already sets for `wasm-pack`: this job only runs the
        # tool, never links against it. The musl build is static, so it runs on
        # the glibc bookworm container without a matching libc.
        #
        # **The checksum is not optional and it is not upstream's.** This
        # project publishes no checksum file for its release assets, and a
        # GitHub release asset can be replaced in place by whoever owns the
        # repository. So the digest below was computed here, from the artefact
        # this workflow was written against, and pins it: a substituted tarball
        # fails the job instead of executing as root in the test container.
        # Bump it together with the version, by downloading and re-computing —
        # never by copying a value from an issue or a README.
        run: |
          curl -fsSL -o /tmp/llvm-cov.tar.gz \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz
          echo "967b5cc996c29d8baa52bbb4595ef1f53af35255af8e2036ddbc6468d7b523c7  /tmp/llvm-cov.tar.gz" | sha256sum -c -
          tar -xzf /tmp/llvm-cov.tar.gz -C /usr/local/bin
          cargo llvm-cov --version
      - name: Install cargo-nextest
        # A prebuilt release binary, the pattern this file already uses three
        # times over — for cargo-llvm-cov above, node below in this same job,
        # and wasm-pack in the `wasm` job below. The musl build is static, so
        # it runs on the glibc bookworm container without a matching libc.
        #
        # **The checksum is not optional and it is not upstream's.** nextest
        # publishes no checksum file for its release assets, and a GitHub
        # release asset can be replaced in place by whoever owns the
        # repository. The digest below was computed here, from the artefact
        # this workflow was written against. Bump it together with the version,
        # by downloading and re-computing — never by copying a value from an
        # issue or a README.
        run: |
          curl -fsSL -o /tmp/nextest.tar.gz \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.140/cargo-nextest-0.9.140-x86_64-unknown-linux-musl.tar.gz
          echo "bc2a998567816eef7b087b920036f49fb89aa2a8a603f6a3d84098be160b62c5  /tmp/nextest.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nextest.tar.gz -C /usr/local/bin
          cargo nextest --version
      - name: Install strace
        # O104's three tests assert the syscalls `atomic::write` and
        # `stamp::rewrite_one` make — the staged file synced before the
        # rename, its directory after — by re-running themselves under strace,
        # and they **fail rather than skip** when it is missing. So this step
        # is what keeps them measuring, not a convenience.
        #
        # From Debian's archive rather than a checksummed tarball, and the
        # reason is the one the comments above turn on: those pin a GitHub
        # release asset its owner can replace in place, while apt verifies every
        # package against the archive's signed Release file. Nor does the
        # version matter the way it does for node — the tests use `-f`, `-qq`,
        # `-y` and `-o`, all far older than bookworm's strace 6.1.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends strace
          strace -V
      - name: Tests, with coverage
        # `cargo llvm-cov nextest` runs the tests — this is the test step, not
        # an addition to it, and the `nextest` subcommand is what applies
        # `.config/nextest.toml`'s per-test timeout. Thirteen files are ignored,
        # in three groups: gated one-off measurement modules, the ones that
        # cannot execute without TAIYAKU_CORPUS which CI does not have, and three
        # `test_support` modules — two `#[cfg(test)] pub(crate)` in taiyaku-serve
        # and one in taiyaku-read that its `test-support` feature also exposes to
        # taiyaku-library's tests, since O104. Counted from the
        # reports rather than from the nine alternations in the regex, which is
        # what the "four" here used to say — `band_sweep.rs`,
        # `borrow_frequency.rs`, `geometry_experiment.rs`, `model_experiment.rs`,
        # `region_experiment.rs`, `score_corpus.rs` and `truth_population.rs` in
        # taiyaku-cli, plus `corpus.rs` in taiyaku-cli, taiyaku-serve and
        # taiyaku-library, and `test_support.rs` twice in taiyaku-serve and once
        # in taiyaku-read, which is two alternations matching three files each.
        # This said eleven while twelve matched, from the day
        # taiyaku-library's `corpus.rs` landed until O104 added the thirteenth.
        #
        # `test_support` is named here only because cargo-llvm-cov's own default
        # exclusion misses it: that default drops a source file whose basename
        # contains `tests`, which takes every `tests.rs` in the workspace out of
        # the report but leaves `test_support.rs` in, for want of an `s`. Naming
        # it makes one rule true of the whole report — no `#[cfg(test)]` code is
        # measured — rather than nearly all of it.
        #
        # Note the regex matches `/corpus.rs` by path segment, so a *new*
        # `corpus.rs` added to some crate that is not corpus-gated would be
        # silently excluded too. Nothing like that exists today — the whole
        # workspace holds exactly these thirteen matching files — but a coverage
        # exclusion that grows on its own is the failure this list is shaped to
        # avoid. This used to ask the reader to check the file count by hand when
        # adding a crate; the "Coverage floor, per file" step below now asserts
        # it (82 files on 2026-09-13, 40 required), so a regex that quietly
        # swallows more than these thirteen fails the job. They are named with a
        # reason each in
        # docs/ci.md, "The coverage gates".
        #
        # `--fail-under-lines 93` is the gate. It was derived as the measured
        # figure less two points, but the figure it was derived from — 95.75%
        # over a report that still contained every inline `#[cfg(test)] mod
        # tests` — no longer exists. Since 2026-08-14 the test modules live in
        # their own files, no `#[cfg(test)]` code reaches the report at all, and
        # the workspace measures 7169 lines at **93.95%** implementation-only.
        # The threshold was deliberately not re-derived downward to 92: leaving
        # it at 93 keeps the gate at least as strict as it was, on a number that
        # now moves about twelve times as far for the same untested code — the
        # slack under the threshold is 68 lines, against 857 while the tests were
        # inline. That is deliberate and it is tight; docs/ci.md, "Why the Rust
        # per-file floor exists", carries the arithmetic and says what to do if
        # it starts costing honest branches. Lines rather than regions because
        # llvm-cov reports regions far below lines on `match`-heavy code and the
        # two would need different numbers for no gain.
        # Keep this in step with scripts/check-all.sh, which runs the same
        # invocation.
        #
        # `TAIYAKU_COMMIT` is the commit under test, so `about`'s route test
        # compares `/api/about`'s `commit` with a real 40-character hash on
        # every pull request, and its `dirty` with `false`, since a commit
        # passed in is never marked. Unset, both sides of that comparison are
        # what `taiyaku-serve`'s build script read from git, which is `null`
        # where it read no commit, and a server that never reported its commit
        # would pass there.
        env:
          TAIYAKU_COMMIT: ${{ github.sha }}
        run: |
          cargo llvm-cov nextest --workspace --all-features \
            --ignore-filename-regex '(band_sweep|borrow_frequency|geometry_experiment|model_experiment|region_experiment|truth_population|score_corpus|/corpus|test_support)\.rs$' \
            --fail-under-lines 93
      - name: Install node
        # This job needs node for exactly one thing — the coverage floor script
        # below — which is why the step sits here rather than with the tool
        # installs above. rust:1-bookworm carries no node at all (the comment at
        # the top of this file records `command -v node` exiting non-zero), so
        # it is fetched the same way the `wasm` job fetches it: a checksummed
        # tarball from nodejs.org rather than a dual-toolchain image. Same
        # version, same digest, same symlink.
        run: |
          curl -fsSL -o /tmp/node.tar.xz \
            https://nodejs.org/dist/v26.7.0/node-v26.7.0-linux-x64.tar.xz
          echo "982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee  /tmp/node.tar.xz" | sha256sum -c -
          tar -xJf /tmp/node.tar.xz -C /opt
          ln -s /opt/node-v26.7.0-linux-x64/bin/node /usr/local/bin/node
          node --version
      - name: Coverage floor, per file
        # **The step above is workspace-aggregate and cannot see one module go
        # dark.** Measured 2026-08-14 over 7169 lines, 6735 covered: a module
        # going entirely dark still passed as long as it accounted for 67 covered
        # lines or fewer, which was 17 of the 43 files then.
        #
        # **Re-measured 2026-08-17, once the library store's Minor fixes
        # landed: 9490 lines, 8834 covered, 93.09% over 53 files — a slack of 8
        # covered lines, and NONE of the 53 at or under it** (the smallest,
        # `taiyaku-serve/src/progress.rs`, carries 11). The blind spot is
        # currently closed altogether, and that is an accident of the margin
        # rather than a property of the check: the slack is
        # `covered - ceil(0.93 * total)`, so it widens as coverage rises and
        # vanishes as it approaches the floor. The per-file step is the half
        # that does not move with it.
        # This is the Rust counterpart of the web job's identically named step,
        # and it runs the identical script.
        #
        # The blind spot was `taiyaku-read/src/pages.rs`-sized until that date —
        # 406 covered lines going dark landed the workspace at 93.05% and passed,
        # against 89.85% and a red step today. Nothing about the tests changed;
        # the test modules moved into their own files and stopped being counted
        # as coverage of the code they test. scripts/coverage-floor.mjs carries
        # the arithmetic.
        #
        # **This step is also the one that says something when the aggregate
        # fires.** Re-measured on this tree by `#[ignore]`-ing all 100 tests in
        # `taiyaku-cli/src/tests.rs`: the step above exits 1 having written 9,165
        # bytes to stdout — the ordinary table — and **zero to stderr**, while
        # this one prints `crates/taiyaku-cli/src/main.rs lines 11.84% < 57%` and
        # names what to open.
        #
        # **`cargo llvm-cov report` is not a second test run.** It re-renders the
        # profile data the step above already produced — no rebuild, no re-run —
        # and measured 0.13 seconds against 7.8 for the run itself. It is a
        # separate command rather than another flag because `--text` and
        # `--json` are mutually exclusive, and dropping the text table would cost
        # this job its only human-readable coverage output.
        #
        # **`cargo llvm-cov --fail-under-file-lines` exists and is deliberately
        # not used.** It works, but it exits 1 having printed nothing at all —
        # measured, zero bytes on stdout and stderr beyond the ordinary table —
        # naming neither the file nor the threshold. A red step above a 43-row
        # table with no indication which row is the reason is not a gate anyone
        # can act on.
        #
        # The `--ignore-filename-regex` is repeated from the step above and the
        # two cannot silently disagree: a narrower copy lets the excluded files
        # in at 12–40% and the floor names them; a wider one drops the file count
        # and the script's minimum-file check fires. Both were run.
        #
        # Keep the three lines below in step with scripts/check-all.sh, together
        # with the three in the step above: strip the leading whitespace from
        # all six, and the `run` / `run env -u TAIYAKU_CORPUS` prefixes on the
        # other side, and the two files hash identically.
        run: |
          cargo llvm-cov report --json --output-path target/rust-coverage.json \
            --ignore-filename-regex '(band_sweep|borrow_frequency|geometry_experiment|model_experiment|region_experiment|truth_population|score_corpus|/corpus|test_support)\.rs$'
          node scripts/coverage-floor.mjs target/rust-coverage.json

      # docs/status.md states a total test count twice and nothing derived
      # either figure, so both went stale on three consecutive branches in one
      # day. This is the only documentation claim in the repository that is
      # mechanically checkable, so it is the one that gets checked — the site
      # counts and the open-item counts beside it are not derivable and stay
      # the reviewer's job.
      #
      # Reads the run two steps up rather than running anything.
      # .config/nextest.toml sets junit.path, so `cargo llvm-cov nextest`
      # writes target/nextest/default/junit.xml on its way past and this step
      # is one node process over an XML file — no build, no test run.
      #
      # It was a fresh `cargo nextest list` until 2026-08-11 and cost 14.3 s a
      # push: llvm-cov builds with coverage instrumentation, so a plain `list`
      # could not reuse the artifacts and rebuilt the workspace — 31% of this
      # job's wall clock to check one number.
      # scripts/status-test-count.mjs records why that was the wrong trade.
      - name: Check the test count in docs/status.md
        run: node scripts/status-test-count.mjs target/nextest/default/junit.xml docs/status.md

  # The core is required to stay WebAssembly-compatible so the browser reader
  # and a future native shell can share it. This is easy to break by accident —
  # one dependency pulling in threads or a native library does it — and the
  # breakage is invisible until you try to ship the reader. Hence a CI gate from
  # day one rather than a discovery six months in.
  #
  # The last three steps close a gap docs/ci.md used to document as permanent:
  # nothing in CI ever executed the compiled module, so a codegen break in
  # `binding.rs` (as against the conversion drift `cargo test -p taiyaku-wasm`
  # already catches) went green. `node` is fetched as a checksummed tarball and
  # unpacked into this container rather than installed by switching to a
  # dual-toolchain image, per the cost comparison recorded in docs/ci.md;
  # `wasm-pack` is fetched as a prebuilt release binary rather than
  # `cargo install`ed, since the latter is a multi-minute compile for a tool
  # this job only runs, never links against.
  wasm:
    runs-on: docker
    timeout-minutes: 10
    container:
      image: rust:1-bookworm
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          host="${FORGEJO_SERVER_URL#http://}"; host="${host#https://}"
          scheme="${FORGEJO_SERVER_URL%%://*}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${FORGEJO_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF"
          git checkout -q FETCH_HEAD
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build core for wasm
        run: cargo build -p taiyaku-core --target wasm32-unknown-unknown --all-features
      - name: Build the binding for wasm
        run: cargo build -p taiyaku-wasm --target wasm32-unknown-unknown --all-features
      - name: Install node
        # Debian bookworm's `nodejs` package is 18.20.4, so this step used to
        # run the smoke test on Node 18 while the `web` job ran 22 — not a
        # decision, just what `apt-get` happened to ship. A prebuilt tarball
        # pins it to the same 26.7.0 everything else uses, following the
        # precedent this job already sets for `wasm-pack`. The checksum is
        # from nodejs.org's own SHASUMS256.txt for this file.
        #
        # Five places name a Node version and nothing keeps them in step:
        # this pin (below, twice — the download URL and the symlink target),
        # the identical pin in the `test` job above, which fetches node for
        # the per-file coverage floor, the `web` job's `node:26-bookworm`
        # image tag below, `.node-version` at the repository root, which
        # nothing reads, and `web/package.json`'s `@types/node`, which tracks
        # the runtime major by convention rather than by any check.
        # `docs/ci.md` enumerates all five in a table, so the count can be
        # argued with there rather than re-derived. Bump them together.
        run: |
          curl -fsSL -o /tmp/node.tar.xz \
            https://nodejs.org/dist/v26.7.0/node-v26.7.0-linux-x64.tar.xz
          echo "982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee  /tmp/node.tar.xz" | sha256sum -c -
          tar -xJf /tmp/node.tar.xz -C /opt
          ln -s /opt/node-v26.7.0-linux-x64/bin/node /usr/local/bin/node
          node --version
      - name: Install wasm-pack
        # A prebuilt release binary, fetched and verified to resolve rather
        # than guessed at (see docs/ci.md). Bump the version here and in
        # rust-toolchain.toml's neighbourly context together if either drifts.
        #
        # The checksum was added on the coverage branch, not when this step was
        # written: this job downloads three binaries and only node's was pinned,
        # so two of the three would have executed whatever the URL happened to
        # return. wasm-pack publishes no checksum file either, so this digest
        # was computed here from the artefact in use. Re-compute it on a bump.
        run: |
          curl -fsSL -o /tmp/wasm-pack.tar.gz \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install -m 0755 /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
      - name: Build the browser package
        run: ./scripts/build-wasm.sh
      - name: Run the compiled module
        run: node scripts/smoke-wasm.mjs

  # A node image, not a dual-toolchain one. Everything this job tests is pure
  # TypeScript: reading.ts and pairing.ts sit behind the Resolver interface and
  # import no WASM, so building the binding here would mean a dual-toolchain
  # image plus a `cargo install wasm-pack` compile for a smoke test that is
  # already a one-line local command. `typecheck` (`tsc -b`, no bundling) still
  # walks resolver.ts to type-check reading.ts's imports from it; its own
  # `taiyaku-wasm` import degrades to an ignored, unresolvable module in this
  # job rather than failing the build — see docs/ci.md for what that leaves
  # ungated.
  web:
    runs-on: docker
    timeout-minutes: 10
    container:
      image: node:26-bookworm
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          host="${FORGEJO_SERVER_URL#http://}"; host="${host#https://}"
          scheme="${FORGEJO_SERVER_URL%%://*}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${FORGEJO_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF"
          git checkout -q FETCH_HEAD
      - name: Install pnpm
        # `pnpm/action-setup` is a JavaScript action, and this workflow's
        # opening comment records the measured finding that `container:` plus
        # any JS action dies before its first step on this runner. A global
        # npm install needs nothing from the image and cannot hit that.
        run: npm i -g pnpm@11.3.0
      - name: Install
        run: pnpm -C web install --frozen-lockfile
      - name: Lint
        run: pnpm -C web run lint
      - name: Typecheck
        run: pnpm -C web run typecheck
      - name: Tests, with coverage
        # `--project node --project jsdom --coverage`: both projects in one
        # run, which is why this replaces the separate `test` and `test:jsdom`
        # steps rather than joining them — the same trade the `test` job makes
        # with `cargo llvm-cov`. The `browser` project is deliberately not here;
        # it needs a Chromium download this cacheless CI would repeat every run,
        # and a gate must measure what CI can reproduce.
        #
        # The thresholds are in `web/vite.config.ts` and fire only under
        # `--coverage`, so a plain `vitest run` here would leave the web half of
        # the gate enforcing nothing while reading green. Mirrored in
        # scripts/check-all.sh; see docs/ci.md, "The coverage gates".
        run: pnpm -C web run test:coverage
      - name: Coverage floor, per file
        # The other half of the web gate. `vite.config.ts`'s thresholds are
        # aggregate, and an aggregate cannot see one module go dark: measured,
        # skipping the whole of `pairing.test.ts` takes that file from 100% to
        # 83.58% while the total moves only 98.03% → 97.49% — because
        # `App.test.tsx` covers the same lines through a mounted reader — and
        # every vitest threshold still passed. This step fails on it.
        #
        # vitest cannot express both halves: a glob entry in `thresholds` is
        # aggregated over its matches, and `perFile` inside one is ignored. Both
        # were tried and measured before this script existed.
        run: node scripts/coverage-floor.mjs

  # Builds the image, runs it until its health check passes, and pushes it —
  # on `main` only, after the four jobs above pass, for a push, the weekly
  # schedule or a dispatch. Never a required status: branch protection names
  # the four `(pull_request)` contexts, and this job does not run on a pull
  # request. See docs/ci.md, "The image job".
  docker:
    needs: [lint, test, wasm, web]
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: docker
    # Nothing has timed a cold image build on the NAS. Its i7-9700K is
    # slower per core than the workstation and carries other load, the wasm
    # and web stages run beside the server stage, and a first run also pulls
    # three base images and installs the toolchain twice; the builder's cache
    # makes later runs far shorter. Re-size it from the first real runs.
    timeout-minutes: 60
    # No `container:`, unlike every job above. The runner's default image
    # carries git and curl, and the runner automounts the host's Docker socket
    # into it (`docker_host: automount`), which is all this job needs.
    # redextape's image job runs this way on the same runner.
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          host="${FORGEJO_SERVER_URL#http://}"; host="${host#https://}"
          scheme="${FORGEJO_SERVER_URL%%://*}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${FORGEJO_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF"
          git checkout -q FETCH_HEAD
      - name: Install the docker CLI and buildx
        run: |
          curl -fsSL -o /tmp/docker.tgz \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.5.3.tgz
          echo "34eea64e9c3435f5af1b760827a56a561cd67fc2d6e9cd1813b8bb1e3ff7930b  /tmp/docker.tgz" | sha256sum -c -
          tar -xzf /tmp/docker.tgz -C /usr/local/bin --strip-components=1 docker/docker
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL -o "$HOME/.docker/cli-plugins/docker-buildx" \
            https://github.com/docker/buildx/releases/download/v0.34.0/buildx-v0.34.0.linux-amd64
          echo "0144479d5a1cd710be3464ae898628cfa68033e16b225aef52f81930c45ac9b5  $HOME/.docker/cli-plugins/docker-buildx" | sha256sum -c -
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
          docker version
          docker buildx version
      # An isolated docker-container builder, so nothing under the registry
      # name lands in the host's image store (the smoke build's `--load` does
      # tag `taiyaku-ci:$SHORT` there, under another name) — a local `:latest`
      # moving underneath WUD would look like no change at all. Its cache
      # volume outlives the container, which is why the stale container is
      # removed with `docker rm` and never `docker buildx rm`. The name is
      # this repository's alone: redextape's job removes its own builder by
      # name the same way. The CPU cap is here because BuildKit runs as its
      # own container, outside the runner's `--cpus 4`.
      - name: Set up the isolated builder
        run: |
          docker rm -f buildx_buildkit_taiyaku-builder0 >/dev/null 2>&1 || true
          docker buildx create --name taiyaku-builder --driver docker-container \
            --driver-opt cpu-period=100000 --driver-opt cpu-quota=400000 --use
      - name: Name the build
        id: t
        env:
          SHA: ${{ github.sha }}
        run: echo "short=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      # `TAIYAKU_COMMIT` is the commit the server reports at `/api/about`,
      # compiled in by the Dockerfile's server stage. The push below passes
      # the same value: it rebuilds, and without the argument it would publish
      # a server that is not the one probed here.
      #
      # **A refresh (the schedule or a dispatch) adds `--no-cache-filter
      # runtime`, here and to the push.** The isolated builder set up above
      # resolves the base images against the registry on every build, but
      # with the base digest and the commit unchanged its cache would replay
      # the old `apt-get upgrade` and `apt-get install` layer, which is the
      # one thing a refresh exists to update. Only the `runtime` stage is
      # rebuilt on purpose: the wasm, web and server stages stay cached only
      # while their bases are unchanged, and rebuild cold when one moved.
      # Both builds, so the probe runs an image built the way the pushed one
      # is.
      #
      # With no `concurrency:` block, a refresh and a push run can overlap,
      # and either job's opening `docker rm -f` of the shared builder can kill
      # the other's build, as two close merges can. A refresh of the SAME
      # commit as a push run still in `docker` (a dispatch right after a
      # merge, or the cron firing while the tip's push run is still building)
      # also shares `taiyaku-ci-$SHORT` and `taiyaku-ci:$SHORT`, so either
      # run can fail the other.
      - name: Build, and load it under a throwaway tag
        env:
          SHORT: ${{ steps.t.outputs.short }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set --
          case "$EVENT" in
            schedule|workflow_dispatch) set -- --no-cache-filter runtime ;;
          esac
          docker buildx build --builder taiyaku-builder --load \
            --provenance=false --sbom=false --build-arg "TAIYAKU_COMMIT=$SHA" "$@" \
            -t "taiyaku-ci:$SHORT" .
      # The image is started here because nothing else ever starts it before
      # it is deployed: a health check that cannot pass would otherwise ship
      # on a green pipeline, which is what redextape's own Dockerfile records.
      # The `grep` of `/usr/local/bin/taiyaku` checks the binary holds the full
      # commit. A build that lost the argument still compiles, starts and
      # passes every probe, and its label reads "unknown build", so nothing
      # else here would fail. `${SHA:?}` aborts on an empty value, which as a
      # pattern would match any file.
      - name: Run it until it is healthy, and probe it
        env:
          SHORT: ${{ steps.t.outputs.short }}
          SHA: ${{ github.sha }}
        run: |
          name="taiyaku-ci-$SHORT"
          docker run -d --name "$name" "taiyaku-ci:$SHORT"
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$name")
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' "$name")" = true ] || break
            sleep 2
          done
          docker logs "$name"
          [ "$status" = healthy ]
          timeout 10 docker exec "$name" taiyaku-probe /read/anything 200
          timeout 10 docker exec "$name" taiyaku-probe /api/me 401
          timeout 10 docker exec "$name" taiyaku-probe /api/nothing-here 404
          docker run --rm --entrypoint grep "taiyaku-ci:$SHORT" -qaF "${SHA:?}" /usr/local/bin/taiyaku
      - name: Remove the probe container and image
        if: always()
        env:
          SHORT: ${{ steps.t.outputs.short }}
        run: |
          docker rm -f "taiyaku-ci-$SHORT" >/dev/null 2>&1 || true
          docker rmi "taiyaku-ci:$SHORT" >/dev/null 2>&1 || true
      - name: Log in to the forge's registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login forge.daveynet.xyz -u "$REGISTRY_USER" --password-stdin
      # `:latest` is moved only by the job whose commit is still main's tip.
      # The runner takes two jobs at once and nothing serialises them, so an
      # older merge's job can finish after a newer one's, and whichever push
      # lands last would own `:latest`. The clone above has an authenticated
      # `origin`, so the tip is asked of the forge now rather than assumed. A
      # tip that cannot be read is treated as "not the tip": a `sha-` tag is
      # always safe, and a stale `:latest` is the thing being kept out. POSIX
      # `sh -e`: the failing command sits on the left of `||`, and no pipeline
      # carries the status that matters.
      #
      # **A refresh tags the same way as a push**: it re-pushes, with patched
      # packages, the `sha-` tag of the commit it built (main's tip when the
      # run started), and `:latest` only if that commit is still the tip.
      - name: Push
        env:
          SHORT: ${{ steps.t.outputs.short }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          tips=$(timeout 30 git ls-remote origin refs/heads/main) || tips=""
          tip=${tips%%[[:space:]]*}
          set -- -t "forge.daveynet.xyz/davey/taiyaku:sha-$SHORT"
          if [ "$tip" = "$SHA" ]; then
            set -- "$@" -t forge.daveynet.xyz/davey/taiyaku:latest
          elif [ -z "$tip" ]; then
            echo "could not confirm this commit is main's tip; pushing sha-$SHORT only, not :latest"
          else
            echo "main has moved on (tip: $tip); pushing sha-$SHORT only, not :latest"
          fi
          case "$EVENT" in
            schedule|workflow_dispatch) set -- "$@" --no-cache-filter runtime ;;
          esac
          docker buildx build --builder taiyaku-builder --push \
            --provenance=false --sbom=false --build-arg "TAIYAKU_COMMIT=$SHA" "$@" .
