name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# `uses:` values spell out a full URL on purpose. Forgejo resolves a bare
# `owner/repo` against whatever the instance sets as DEFAULT_ACTIONS_URL, which
# differs between deployments. Naming the host keeps these workflows working
# regardless of how git.daveynet.xyz happens to be configured.

jobs:
  lint:
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Tests
        run: cargo test --workspace --all-features

  # The core is required to stay WebAssembly-compatible so the browser reader
  # and a future native shell can share it. This is easy to break by accident —
  # one dependency pulling in threads or a native library does it — and the
  # breakage is invisible until you try to ship the reader. Hence a CI gate from
  # day one rather than a discovery six months in.
  wasm:
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build core for wasm
        run: cargo build -p taiyaku-core --target wasm32-unknown-unknown --all-features
