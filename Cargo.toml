[workspace]
resolver = "3"
members = ["crates/taiyaku-core", "crates/taiyaku-read", "crates/taiyaku-serve", "crates/taiyaku-cli", "crates/taiyaku-wasm", "crates/taiyaku-library"]
# `spike/` lives outside the workspace so its dependency and its lint standards
# cannot reach the real crates or CI. It used to say "delete once the findings
# land"; they landed twice and it was stripped to one file on 2026-08-12. What
# is left is `probe`, which reports whether `tract` can run a given ONNX graph
# and names the operator when it cannot — a tool for the next candidate, not a
# record of the last one. See its header.
exclude = ["spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/Davey-Hughes/taiyaku"
authors = ["Davey Hughes"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "warn"

# Release profile favours the aligner's hot loops: hashing every page of a volume
# and the dynamic-programming pass over the similarity matrix.
[profile.release]
lto = "thin"
codegen-units = 1
