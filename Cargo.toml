[workspace]
resolver = "3"
members = ["crates/taiyaku-core", "crates/taiyaku-read", "crates/taiyaku-serve", "crates/taiyaku-cli", "crates/taiyaku-wasm", "crates/taiyaku-library"]
# `spike/` lives outside the workspace so its dependency and its lint standards
# cannot reach the real crates or CI. It holds `probe`, which reports whether
# `tract` can run a given ONNX graph and names the operator when it cannot — a
# tool for the next candidate, not a record of the last one. See its header.
exclude = ["spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The lowest rustc that checks every target with every feature, so a
# dev-dependency's floor counts too: `cargo +<version> check --workspace
# --all-targets --all-features --locked`. Clippy's MSRV-gated lints read it.
rust-version = "1.91"
license = "GPL-3.0-or-later"
repository = "https://github.com/Davey-Hughes/taiyaku"
authors = ["Davey Hughes"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "warn"

# compress-tools from the owner's fork: the release reads entry names in the
# environment's locale and crashes on a RAR4 name under C, gives libarchive no
# skip callback, and can leave a thread on a freed locale. Remove this when a
# release carries the fixes (O382).
[patch.crates-io]
compress-tools = { git = "https://github.com/Davey-Hughes/compress-tools-rs", rev = "d823828a49015f9d9b2541f89b07a56421d4b09c" }

# Release profile favours the aligner's hot loops: hashing every page of a volume
# and the dynamic-programming pass over the similarity matrix.
[profile.release]
lto = "thin"
codegen-units = 1
