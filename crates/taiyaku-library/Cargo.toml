[package]
name = "taiyaku-library"
description = "The SQLite library: works, editions, progress and notes, round-tripping to sidecars"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# `taiyaku-serve` is the only consumer. This crate must never be reachable from
# `taiyaku-core` or `taiyaku-wasm`, both of which compile to wasm32, where
# SQLite does not.
#
# **Against the system libsqlite3 rather than `bundled`, measured rather than
# assumed**: bundled builds in 1 m 43 s against 3.06 s on a 32-core machine,
# and CI has no cargo cache and gives each job ten minutes. The cost is that
# FTS5 is now a property of the host's SQLite rather than a guarantee — see
# `Library::open`, which refuses at open time with a named error rather than
# letting a migration die part-way through.
#
# There is no `fts5` Cargo feature on rusqlite; FTS5 is reached from plain SQL.
# `backup` is for `VACUUM INTO`, which is how a backup is taken while the
# server runs (spec A §13.4).
[dependencies]
argon2 = "0.5.3"
base64 = "0.23.1"
# O92's scanner half: `root.exclude_globs` applied to the walk. The matcher
# behind ripgrep, taken whole rather than reimplemented — it reads a line
# exactly as a `.gitignore` file holds it, so negation, anchoring,
# directory-only patterns, comments and blank lines all arrive with it and
# none of them is written here. `rules.rs` makes the same argument against
# itself for `taiyaku_read::volume_number_marked`: a second, drifting
# reimplementation is worse than a dependency.
#
# **Three crates, not the ten `cargo add` suggests** — `ignore`, `globset` and
# `bstr`. `notify` already supplies `walkdir`, `same-file`, the `crossbeam-*`
# trio and `winapi-util`; measured against this workspace's lock on
# 2026-09-09. `globset` alone would have cost two of the same three and could
# not express negation.
#
# **User-supplied patterns are safe here for the reason `regex` below is
# safe**, and it is worth restating because it is not obvious it transfers:
# `globset` compiles to `regex-automata`, which does not backtrack, so a
# pattern typed into C4's box cannot produce catastrophic matching behaviour.
ignore = "0.4.33"
# §8 of the scanner spec: the watcher, where the probe says one works.
notify = "8"
rand = "0.10.2"
# §4 of the scanner spec: the escape hatch for a layout the four rule kinds
# cannot express. Named here rather than slipped in — `docs/status.md` states
# this workspace's short dependency list as a fact about the project.
#
# **User-supplied patterns are safe here in a way they would not be
# elsewhere.** Rust's `regex` has no backtracking and matches in time linear in
# the input, so a pattern typed into C4's text box cannot produce catastrophic
# behaviour. "Accept a user regex" is normally a ReDoS hazard; the reason it is
# not one here is a property of this dependency rather than of the design.
regex = "1.13"
rusqlite = { version = "0.38", features = ["backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# Spec C3 §6's write-back rewrites a member's archive, which means reading its
# central directory and writing it back out with every entry's compressed bytes
# untouched (`ZipWriter::raw_copy_file`). Already in the tree via
# `taiyaku-read`, and named here for the reason that manifest gives for naming
# its own: a direct dependency of this crate's code should be a line in this
# crate's manifest. `docs/status.md` states this workspace's short dependency
# list as a fact about the project, so that file gains a line with this one.
zip = "7.2.0"
taiyaku-core = { path = "../taiyaku-core" }
taiyaku-read = { path = "../taiyaku-read" }

[lints]
workspace = true

# `trace` is enabled for the test build alone, never for the shipped library.
# One test asserts that `Nested`'s `Drop` issues no statement after an ordinary
# commit, and the only way to observe "what SQL actually reached SQLite" is
# `trace_v2`. Cargo unions features across the two tables for the test target
# and leaves the lib build with `backup` only, so tracing costs nothing in the
# binary that serves pages.
#
# `hooks` on the same terms, for O210: `derive`'s tests count the commits a
# pass writes to the WAL, and `wal_hook` is how they see one.
[dev-dependencies]
rusqlite = { version = "0.38", features = ["trace", "hooks"] }
# `test-support` on the same terms, for O104: `stamp`'s tests assert the
# syscalls `rewrite_one` makes, through the one strace parser `atomic`'s tests
# already use rather than a second copy of it. And for O117's `TempDir`.
taiyaku-read = { path = "../taiyaku-read", features = ["test-support"] }
