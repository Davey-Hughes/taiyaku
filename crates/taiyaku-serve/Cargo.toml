[package]
name = "taiyaku-serve"
description = "HTTP server handing a reader the sidecar, pages, progress, and a download, over its own API and an OPDS 1.2 + PSE feed, proxying Stump for pages it holds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum = "0.8"
base64 = "0.23.1"
# Already in the dependency tree via jxl-oxide — named directly here only so
# `jxl.rs` can count what a page's metadata boxes inflate to before jxl-oxide
# inflates them with no limit. Same version jxl-oxide resolves to, so the
# resolver unifies one copy rather than two.
brotli-decompressor = "5.0.3"
# Both already in the dependency tree via axum and hyper — named directly here
# only so `download.rs` can implement `Stream` over an mpsc receiver and hand
# `Body::from_stream` the `Bytes` it wants. Same versions the tree already
# resolves to, so the resolver unifies one copy rather than two. Same reasoning
# as `rusqlite` below.
bytes = "1.12.1"
# Already in the dependency tree via taiyaku-read — named directly here only
# so `download.rs`'s generated path can hash its own `ComicInfo.xml`, whose
# bytes exist only in this crate. Same version taiyaku-read pins, so the
# resolver unifies one copy rather than two.
crc32fast = "1.5.0"
futures-core = "0.3.33"
# Already in the dependency tree via axum and hyper — named directly here only
# so `transfer.rs` can implement the response body trait, whose `Frame` axum
# does not re-export. Same version the tree resolves to, so the resolver
# unifies one copy rather than two.
http-body = "1.1.0"
image = "0.25.9"
# Already in the dependency tree via jxl-oxide — named directly here only so
# `jxl.rs` can read a `jbrd` box's header and find the compressed stream after
# it, which jxl-oxide inflates with no limit, and so `icc_fits` can read the
# encoded colour profile size a page's header declares, which jxl-oxide fills
# with no limit. Same version jxl-oxide resolves to, so the resolver unifies
# one copy rather than two.
jxl-bitstream = "1.1.0"
# Already in the dependency tree via jxl-oxide — named directly here only so
# `jxl.rs` can name `jxl_grid::OutOfMemory`, which jxl-oxide does not
# re-export, and report a decode that outgrew its `max_alloc` as the limits
# error it is. Same version jxl-oxide pins, so the resolver unifies one copy
# rather than two.
jxl-grid = "0.6.2"
# JPEG XL pages, decoded wherever `image` decodes, through the hook `jxl.rs`
# registers. Chosen because it counts the grids it decodes into against
# `Limits::max_alloc`, not only the output buffer `image` reserves first. It
# does not count the metadata boxes it inflates or the colour profile it
# reads; `jxl.rs` caps those.
jxl-oxide = { version = "0.12.6", features = ["image"] }
# Already in the dependency tree via jxl-oxide — named directly here only for
# `Bundle`, the trait that parses that `jbrd` header and, in `icc_fits`, a
# page's image header. Same version jxl-oxide resolves to, so the resolver
# unifies one copy rather than two.
jxl-oxide-common = "1.0.0"
# Already in the dependency tree via taiyaku-library — named directly here
# only so `works.rs`'s bridge from a slug-keyed `Work` to the library's
# numeric `work.id` can name `rusqlite::Connection` and use
# `OptionalExtension`/`params!`. Same version taiyaku-library pins, so the
# resolver unifies one copy rather than two.
rusqlite = "0.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
taiyaku-core = { path = "../taiyaku-core" }
taiyaku-library = { path = "../taiyaku-library" }
taiyaku-read = { path = "../taiyaku-read" }
# "time" is already in the dependency tree — axum's own "tokio" feature pulls
# it in via hyper-util — but named directly here so `download.rs`'s idle send
# timeout can name `tokio::time::timeout` without depending on another
# crate's feature graph to keep enabling it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
ureq = "3.3.0"

[dev-dependencies]
# `test-support` for `TempDir`, O117: a directory unique to the process and the
# call, the one helper every crate's tests share.
taiyaku-read = { path = "../taiyaku-read", features = ["test-support"] }
# `test-support` for `Access::roots`, a test's access by directories alone, and
# for `scan::file_under_its_own_library` and the `test_support` fixtures, which
# file a directory planted by SQL under a library as the add would.
taiyaku-library = { path = "../taiyaku-library", features = ["test-support"] }
zip = "9.1.3"
# `hooks` for the verify-permit tests (O57): they see a commit from inside it, on
# the thread that is writing it, to ask whether a permit was free at that moment.
# `trace` for the Libraries list's snapshot test, which commits a removal from a
# second connection at the first row the list reads.
# `limits` for O387's tests, which lower SQLite's parameter ceiling to one so a
# listing's prepare is refused at a position, as one past the ceiling is.
rusqlite = { version = "0.43", features = ["hooks", "limits", "trace"] }
# Already in the dependency tree via jxl-oxide — named directly here only so
# `jxl/process_tests.rs` can hold the shared pool's threads and read their
# priority. The version `taiyaku-cli` names, so the resolver unifies one copy
# rather than two.
rayon = "1.12.0"
# Already in the dependency tree via jxl-oxide — named directly here only so
# `jxl/process_tests.rs` can decode and parse an encoded colour profile as
# jxl-oxide does once it has read one, and measure what that costs at
# `ICC_CAP`. Same version jxl-oxide resolves to, so the resolver unifies one
# copy rather than two.
jxl-color = "0.11.0"
# `test-util` for the cache sweep's schedule test: a paused clock runs through
# a day's wait without taking it.
tokio = { version = "1", features = ["test-util"] }

[features]
# Passes `taiyaku-read`'s RAR backend through, so the binary turns it on by one name; off by default, so a plain build needs no libarchive.
rar-libarchive = ["taiyaku-library/rar-libarchive"]

[lints]
workspace = true
