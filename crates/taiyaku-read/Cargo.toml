[package]
name = "taiyaku-read"
description = "Reading a manga edition's pages from archives and directories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Native-only by design: archive reading and content hashing. taiyaku-core stays
# free of all of this so it keeps compiling to wasm32.
[dependencies]
# Already in the dependency tree via `zip` — named directly here only so
# `member_page_entries` can hash a directory member's pages, which is the one
# case a zip central directory cannot answer. Same version `zip` resolves to,
# so the resolver unifies one copy rather than two.
crc32fast = "1.5.0"
sha2 = "0.11.0"
zip = "9.1.3"
# Strict XML for `book`: an EPUB's documents are XHTML, and one that does
# not parse is refused rather than recovered by guessing.
roxmltree = "0.21.2"
# Optional: only `test_support::cbz_pages` encodes pages, and no binary this
# workspace ships should carry an image codec for it. PNG alone is what it
# writes; the other crates that enable `image` bring their own codecs.
image = { version = "0.25.9", default-features = false, features = ["png"], optional = true }
# Optional and off by default: the RAR backend over the system's libarchive. A
# build without it links no libarchive and refuses RAR.
compress-tools = { version = "0.16", optional = true }

# Exposes `test_support` to other crates' tests. Enabled only from a
# `[dev-dependencies]` entry, so it reaches test builds and `--all-features`
# builds and no binary this workspace ships — see that module's own doc for
# why it is shared rather than copied.
[features]
test-support = ["dep:image"]
# `build.rs` sets the `rar` cfg when any RAR backend's feature is on.
rar-libarchive = ["dep:compress-tools"]

[lints]
workspace = true
