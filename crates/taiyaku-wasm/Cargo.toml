[package]
name = "taiyaku-wasm"
description = "WebAssembly binding over taiyaku-core, for a browser reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# This crate exists so that `taiyaku-core`'s public API is not shaped by what can
# cross the JavaScript boundary. The pressure is real and visible here:
# `Option<Half>` had to become `Option<String>` and `Via` a `String` to make the
# crossing. Keeping that in its own crate leaves the core usable from the CLI,
# the server and any future native shell without acquiring `wasm-bindgen` at
# all. The logic is in `binding.rs` as plain Rust; the `wasm_bindgen` types in
# `lib.rs` are a shell over it.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
taiyaku-core = { path = "../taiyaku-core" }
wasm-bindgen = "0.2"

[lints]
workspace = true
