[package]
name = "taiyaku-cli"
description = "Command-line aligner for taiyaku"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "taiyaku"
path = "src/main.rs"

# Native-only work belongs here rather than in taiyaku-core: image decoding, the
# content-addressed fingerprint cache, and parallel hashing across pages.
[dependencies]
base64 = "0.23.0"
image = "0.25.9"
rayon = "1.12.0"
# Already in the dependency tree via taiyaku-serve — named directly here only
# so `library.rs` can name `taiyaku_library::{Library, import, export, project}`
# and use `rusqlite::OptionalExtension` to resolve `--db`'s work rows. Same
# version taiyaku-library and taiyaku-serve both pin, so the resolver unifies
# one copy rather than two.
rusqlite = "0.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
taiyaku-core = { path = "../taiyaku-core" }
taiyaku-library = { path = "../taiyaku-library" }
taiyaku-read = { path = "../taiyaku-read" }
taiyaku-serve = { path = "../taiyaku-serve" }
tokio = { version = "1", features = ["rt-multi-thread"] }

# `tract-onnx` is here for `model_experiment.rs` alone, and a dev-dependency is
# what keeps it out of the `taiyaku` binary while leaving the module inside the
# workspace, compiled by CI, and unable to rot.
#
# It is not free: CI has no cargo cache (see `.forgejo/workflows/ci.yml`), so
# both the clippy job and the test job compile it from scratch every run. That
# cost is accepted rather than hidden behind an optional feature, because
# dodging it would mean dropping `--all-features` from two CI invocations and
# leaving this module never compiled by the gate.
[dev-dependencies]
# `test-support` for `TempDir`, O117: a directory unique to the process and the
# call, the one helper every crate's tests share; `cbz_pages` comes from it too.
taiyaku-read = { path = "../taiyaku-read", features = ["test-support"] }
# `test-support` for `Access::roots`: a test's access by directories alone.
taiyaku-library = { path = "../taiyaku-library", features = ["test-support"] }
tract-onnx = "0.23.4"
zip = "9.1.3"

# `taiyaku-wasm` is here for `borrow_frequency.rs` alone — the gap-frequency
# measurement — and a dev-dependency is what keeps it out of the `taiyaku`
# binary while leaving the module inside the workspace, compiled by CI, and
# unable to rot. The same reasoning as `tract-onnx` above.
#
# It is the *reader's own* resolver rather than a second copy: `binding.rs`
# holds the routing logic as ordinary Rust and the wasm layer above it decides
# nothing, so measuring through it measures what the browser does. `display` and
# `withBorrow` are ported by hand, and the design's §5 says so.
taiyaku-wasm = { path = "../taiyaku-wasm" }

[lints]
workspace = true
