[package]
name = "taiyaku-cli"
description = "Command-line aligner for taiyaku"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "taiyaku"
path = "src/main.rs"

# Native-only work belongs here rather than in taiyaku-core: archive reading,
# image decoding, and parallel hashing across pages.
[dependencies]
base64 = "0.23.0"
image = "0.25.9"
rayon = "1.12.0"
taiyaku-core = { path = "../taiyaku-core" }
zip = "7.2.0"

[lints]
workspace = true
